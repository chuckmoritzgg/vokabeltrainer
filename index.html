<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#3867d6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Vokabeltrainer">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Vokabeltrainer</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#68727d;--accent:#3867d6;--ok:#16834b;--bad:#c0392b;--border:#dce1e7}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%;overflow-anchor:none}
.app{max-width:850px;margin:auto;padding:18px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:max(18px,env(safe-area-inset-bottom))}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}h1{font-size:1.45rem;margin:.2rem 0}.stats{color:var(--muted);font-size:.9rem}
.menu,.card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 5px 20px #0000000b}.menu{margin:14px 0;overflow:hidden}.menu summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;user-select:none}.menu summary::-webkit-details-marker{display:none}.menu summary::after{content:"▾";font-size:.9rem;color:var(--muted);transition:transform .18s ease}.menu[open] summary::after{transform:rotate(180deg)}.menu-content{border-top:1px solid var(--border);padding:14px}.menu-section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:2px 0 8px}
.panel{padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.panel label{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted)}select,button,input{font:inherit}select,button,input[type=number]{border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:white;color:var(--text)}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}.page-fields{display:flex;gap:10px;flex-wrap:wrap}.page-fields input{width:100px}
.card{padding:34px 28px;margin-top:14px;text-align:center;min-height:390px;display:flex;flex-direction:column;justify-content:center;overflow-anchor:none;contain:layout paint}.prompt-label{color:var(--muted);font-size:.9rem}.source-label{color:var(--muted);font-size:.8rem;margin-top:8px}.prompt{font-size:2.15rem;font-weight:700;margin:18px 0 24px;overflow-wrap:anywhere}.answer{width:min(620px,100%);margin:0 auto;padding:14px;border:2px solid var(--border);border-radius:12px;outline:none;text-align:center;font-size:1.25rem;scroll-margin-top:140px}.answer:focus{border-color:var(--accent)}.feedback{margin:18px auto 0;max-width:650px;text-align:left;padding:16px;border-radius:12px}.feedback.ok{background:#eaf8f0;border:1px solid #bfe7ce}.feedback.bad{background:#fff0ee;border:1px solid #f0c0ba}.correct{font-size:1.25rem;font-weight:700;color:var(--ok);word-break:break-word}.wrong{font-size:1.1rem;font-weight:700;color:var(--bad);word-break:break-word}.context{margin-top:10px;color:#4c5661;font-style:italic}.actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}.progress{height:8px;background:#e7ebef;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:var(--accent);width:0}.hidden{display:none!important}.small{font-size:.85rem;color:var(--muted)}.unit-badge{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3346a3;font-size:.78rem;font-weight:600;vertical-align:middle}.data-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}.file-input{display:none}.hint{margin:4px 0 0;color:var(--muted);font-size:.8rem}.error{padding:14px;border:1px solid #f0c0ba;background:#fff0ee;border-radius:12px;color:#8f2d22}
@media(max-width:600px){.app{padding-top:12px}.card{padding:24px 16px;min-height:430px;justify-content:flex-start}.prompt-label{margin-top:34px}.prompt{font-size:1.8rem;margin-top:16px}.answer{font-size:1.1rem}.panel label{flex:1 1 145px}.panel select{width:100%}.panel .primary{flex:1 1 100%}.page-fields{width:100%}.page-fields label{flex:1}.page-fields input{width:100%}}
@media(max-height:560px) and (pointer:coarse){.card{min-height:430px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1>Vokabeltrainer <span class="unit-badge" id="selectionBadge">Lädt …</span></h1><div class="stats" id="stats"></div><div class="hint" id="bookHint"></div></div></div>

  <details class="menu" id="adminMenu" open>
    <summary>Training &amp; Verwaltung</summary>
    <div class="menu-content">
      <div class="menu-section-title">Training auswählen</div>
      <div class="panel">
        <label>Buch<select id="book"></select></label>
        <label>Lernbereich<select id="selectionMode"><option value="unit">Ganze Unit</option><option value="pages">Seitenbereich</option></select></label>
        <label id="unitWrap">Unit<select id="unit"></select></label>
        <div class="page-fields hidden" id="pageFields">
          <label>Von Seite<input id="pageFrom" type="number" inputmode="numeric"></label>
          <label>Bis Seite<input id="pageTo" type="number" inputmode="numeric"></label>
        </div>
        <label>Richtung<select id="direction"><option value="de-en">Deutsch → Englisch</option><option value="en-de">Englisch → Deutsch</option></select></label>
        <label>Auswahl<select id="scope"><option value="due">Wiederholung fällig</option><option value="all">Alle Vokabeln</option><option value="weak">Schwierige Vokabeln</option><option value="new">Noch nicht gelernt</option></select></label>
        <label>Neue Karten<select id="newLimit"><option>10</option><option>20</option><option>30</option><option>50</option><option value="9999">Alle</option></select></label>
        <button class="primary" id="startBtn">Training starten</button>
      </div>
      <div class="data-actions">
        <button id="exportBtn">Fortschritt exportieren</button>
        <button id="importBtn">Fortschritt importieren</button>
        <input id="importFile" class="file-input" type="file" accept="application/json,.json">
        <button id="resetBtn">Fortschritt zurücksetzen</button>
      </div>
      <p class="hint">Die Vokabeldaten werden getrennt aus JSON-Dateien geladen. Dadurch können später weitere Units und Bücher ergänzt werden, ohne sie in den HTML-Code einzubauen.</p>
    </div>
  </details>

  <div id="loadError" class="error hidden"></div>
  <div class="card" id="studyCard">
    <div class="prompt-label" id="promptLabel">Training auswählen und starten.</div>
    <div class="source-label" id="sourceLabel"></div>
    <div class="prompt" id="prompt">Bereit?</div>
    <input class="answer" id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Antwort eintippen" disabled>
    <div class="feedback hidden" id="feedback"></div>
    <div class="actions"><button class="primary" id="checkBtn" disabled>Prüfen</button><button id="showBtn" disabled>Antwort zeigen</button><button id="nextBtn" class="hidden">Weiter</button></div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="small" id="counter"></div>
  </div>
</div>
<script>
const STORAGE_KEY="vokabeltrainer_progress_v4";
const SCHEMA_VERSION=4;
let manifest=[], bookCache=new Map(), currentBook=null, queue=[], pos=0, current=null, answered=false;
let store=loadStore();
const $=id=>document.getElementById(id);

function safeParse(s){try{return JSON.parse(s)}catch{return null}}
function emptyStore(){return {schemaVersion:SCHEMA_VERSION,active:{book:null,mode:"unit",unit:null,pageFrom:null,pageTo:null,direction:"de-en",scope:"due",newLimit:20},progress:{}}}
function loadStore(){
  const now=safeParse(localStorage.getItem(STORAGE_KEY)); if(now?.schemaVersion===SCHEMA_VERSION)return now;
  const out=emptyStore();
  const v3=safeParse(localStorage.getItem("vokabeltrainer_progress_v3"));
  if(v3?.progress){out.progress=v3.progress;out.active={...out.active,...v3.active};}
  else {
    const v2=safeParse(localStorage.getItem("vokabeltrainer_units_v2"));
    if(v2?.progress){out.progress["green-line-2-kl6"]={};for(const u of ["unit1","unit2"])if(v2.progress[u])out.progress["green-line-2-kl6"][u]=v2.progress[u];}
    const v1=safeParse(localStorage.getItem("vokabeltrainer_unit1_v1"));
    if(v1 && !out.progress?.["green-line-2-kl6"]?.unit1){out.progress["green-line-2-kl6"]??={};out.progress["green-line-2-kl6"].unit1=v1.progress||v1;}
  }
  localStorage.setItem(STORAGE_KEY,JSON.stringify(out)); return out;
}
function saveStore(){localStorage.setItem(STORAGE_KEY,JSON.stringify(store));updateStats();}
function unitMeta(id){return currentBook.units.find(u=>u.id===id)}
function cardState(card,create=true){store.progress[currentBook.id]??={};store.progress[currentBook.id][card.unit]??={};let s=store.progress[currentBook.id][card.unit][card.id];if(!s&&create){s={correct:0,wrong:0,seen:0,due:0,streak:0,last:0};store.progress[currentBook.id][card.unit][card.id]=s;}return s||{correct:0,wrong:0,seen:0,due:0,streak:0,last:0};}
function norm(s){return String(s??"").trim().toLocaleLowerCase("en-GB").replace(/[’‘`´]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g," ");}
function answerVariants(s){const raw=String(s??"");const variants=[norm(raw),norm(raw.replace(/[()]/g,"")),norm(raw.replace(/\s*\([^)]*\)/g,""))];return [...new Set(variants.filter(Boolean))]}
function isCorrect(given,expected){return answerVariants(expected).includes(norm(given));}

async function fetchJSON(url){const r=await fetch(url,{cache:"no-cache"});if(!r.ok)throw new Error(`${url}: HTTP ${r.status}`);return r.json();}
async function loadBook(id){if(bookCache.has(id))return bookCache.get(id);const meta=manifest.find(b=>b.id===id);if(!meta)throw new Error("Buch nicht gefunden.");const book=await fetchJSON(meta.file);bookCache.set(id,book);return book;}
async function init(){
 try{
  manifest=await fetchJSON("./data/books.json");
  $("book").innerHTML="";manifest.forEach(b=>{const o=document.createElement("option");o.value=b.id;o.textContent=b.title+(b.subtitle?" – "+b.subtitle:"");$("book").append(o)});
  const preferred=manifest.some(b=>b.id===store.active?.book)?store.active.book:manifest[0].id;$("book").value=preferred;currentBook=await loadBook(preferred);
  populateBookUI();restoreActiveControls();updateSelectionUI();resetStudyView();updateStats();
 }catch(e){$("loadError").textContent="Vokabeldaten konnten nicht geladen werden: "+e.message;$("loadError").classList.remove("hidden");$("studyCard").classList.add("hidden");}
}
function populateBookUI(){
 $("unit").innerHTML="";currentBook.units.forEach(u=>{const o=document.createElement("option");o.value=u.id;o.textContent=`${u.title} (S. ${u.pages[0]}–${u.pages[1]})`;$("unit").append(o)});
 const pr=currentBook.pageRange;$("pageFrom").min=pr.min;$("pageFrom").max=pr.max;$("pageTo").min=pr.min;$("pageTo").max=pr.max;
}
function restoreActiveControls(){const a=store.active||{};const unit=currentBook.units.some(u=>u.id===a.unit)?a.unit:currentBook.units[0].id;$("unit").value=unit;$("selectionMode").value=a.mode||"unit";const p=unitMeta(unit).pages;$("pageFrom").value=a.pageFrom??p[0];$("pageTo").value=a.pageTo??p[1];$("direction").value=a.direction||"de-en";$("scope").value=a.scope||"due";$("newLimit").value=String(a.newLimit||20);}
function updateSelectionUI(){const pages=$("selectionMode").value==="pages";$("unitWrap").classList.toggle("hidden",pages);$("pageFields").classList.toggle("hidden",!pages);updateStats();}
function selectedCards(){
 if(!currentBook)return[];
 if($("selectionMode").value==="unit")return currentBook.cards.filter(c=>c.unit===$("unit").value);
 let a=+$("pageFrom").value,b=+$("pageTo").value;if(a>b)[a,b]=[b,a];return currentBook.cards.filter(c=>c.page>=a&&c.page<=b);
}
function selectionLabel(){if(!currentBook)return"";if($("selectionMode").value==="unit")return unitMeta($("unit").value)?.title||"Unit";let a=+$("pageFrom").value,b=+$("pageTo").value;if(a>b)[a,b]=[b,a];return `S. ${a}–${b}`;}
function persistControls(){store.active={book:currentBook.id,mode:$("selectionMode").value,unit:$("unit").value,pageFrom:+$("pageFrom").value,pageTo:+$("pageTo").value,direction:$("direction").value,scope:$("scope").value,newLimit:+$("newLimit").value};saveStore();}
function updateStats(){
 if(!currentBook)return;const cards=selectedCards();let seen=0,due=0,weak=0;for(const c of cards){const s=cardState(c,false);if(s.seen)seen++;if((s.due||0)<=Date.now())due++;if(s.seen&&s.wrong>s.correct)weak++;}
 $("stats").textContent=`${cards.length} Vokabeln · ${seen} gelernt · ${due} fällig · ${weak} schwierig`;$("selectionBadge").textContent=selectionLabel();$("bookHint").textContent=currentBook.title+(currentBook.subtitle?" · "+currentBook.subtitle:"");$("resetBtn").textContent="Fortschritt für Auswahl zurücksetzen";
}
function chooseQueue(){const scope=$("scope").value,limit=+$("newLimit").value;let arr=selectedCards().filter(c=>{const s=cardState(c);if(scope==="all")return true;if(scope==="new")return !s.seen;if(scope==="weak")return s.seen&&s.wrong>s.correct;return (s.due||0)<=Date.now();});if(scope==="due"){const fresh=arr.filter(c=>!cardState(c).seen).slice(0,limit),old=arr.filter(c=>cardState(c).seen);arr=[...fresh,...old]}for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr;}
function startTraining(){persistControls();queue=chooseQueue();pos=0;answered=false;if(!queue.length){$("promptLabel").textContent="Keine passenden Vokabeln in dieser Auswahl.";$("sourceLabel").textContent="";$("prompt").textContent="✓";$("answer").disabled=true;$("checkBtn").disabled=true;$("showBtn").disabled=true;$("adminMenu").open=true;return}$("adminMenu").open=false;showCard();}
function showCard(){current=queue[pos];answered=false;const dir=$("direction").value;$("promptLabel").textContent=dir==="de-en"?"Deutsch → Englisch":"Englisch → Deutsch";const u=unitMeta(current.unit);$("sourceLabel").textContent=`${u?.title||current.unit} · Seite ${current.page}`;$("prompt").textContent=dir==="de-en"?current.de:current.en;$("answer").value="";$("answer").disabled=false;$("feedback").className="feedback hidden";$("feedback").innerHTML="";$("checkBtn").disabled=false;$("showBtn").disabled=false;$("nextBtn").classList.add("hidden");updateProgress();setTimeout(()=>focusStable(),60);}
function focusStable(){const y=window.scrollY;$("answer").focus({preventScroll:true});requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"instant"}));}
function expected(){return $("direction").value==="de-en"?current.en:current.de;}
function grade(ok,shown=false){if(answered)return;answered=true;const s=cardState(current);s.seen++;s.last=Date.now();if(ok&&!shown){s.correct++;s.streak=(s.streak||0)+1;const days=[1,3,7,14,30,60][Math.min(s.streak-1,5)];s.due=Date.now()+days*86400000;}else{s.wrong++;s.streak=0;s.due=Date.now()+2*60000;}saveStore();const user=$("answer").value;const exp=expected();$("feedback").className="feedback "+(ok&&!shown?"ok":"bad");$("feedback").innerHTML=(ok&&!shown?`<div class="correct">✓ Richtig</div>`:`${shown?"":`<div class="wrong">Deine Antwort: ${escapeHtml(user||"(leer)")}</div>`}<div class="correct">Richtig: ${escapeHtml(exp)}</div>`)+(current.context?`<div class="context">${escapeHtml(current.context)}</div>`:"");$("answer").disabled=true;$("checkBtn").disabled=true;$("showBtn").disabled=true;$("nextBtn").classList.remove("hidden");$("nextBtn").focus({preventScroll:true});}
function check(){grade(isCorrect($("answer").value,expected()),false)}
function next(){pos++;if(pos>=queue.length){$("promptLabel").textContent="Training abgeschlossen";$("sourceLabel").textContent="";$("prompt").textContent="Geschafft!";$("answer").disabled=true;$("feedback").className="feedback ok";$("feedback").innerHTML='<div class="correct">Diese Runde ist fertig.</div>';$("nextBtn").classList.add("hidden");$("bar").style.width="100%";$("counter").textContent=`${queue.length} / ${queue.length}`;$("adminMenu").open=true;return}showCard();}
function updateProgress(){$("bar").style.width=((pos/queue.length)*100)+"%";$("counter").textContent=`${pos+1} / ${queue.length}`;}
function resetStudyView(){$("promptLabel").textContent="Training auswählen und starten.";$("sourceLabel").textContent="";$("prompt").textContent="Bereit?";$("answer").value="";$("answer").disabled=true;$("feedback").className="feedback hidden";$("checkBtn").disabled=true;$("showBtn").disabled=true;$("nextBtn").classList.add("hidden");$("bar").style.width="0";$("counter").textContent="";}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
function exportProgress(){persistControls();const blob=new Blob([JSON.stringify({app:"Vokabeltrainer",schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),store},null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`vokabeltrainer-fortschritt-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importProgress(file){try{const data=JSON.parse(await file.text());let incoming=data.store||data;if(incoming.schemaVersion===3){incoming={...emptyStore(),...incoming,schemaVersion:SCHEMA_VERSION,active:{...emptyStore().active,...incoming.active}}}if(incoming.schemaVersion!==SCHEMA_VERSION||!incoming.progress)throw new Error("Unbekanntes Dateiformat.");if(!confirm("Der gespeicherte Fortschritt auf diesem Gerät wird durch die importierte Datei ersetzt. Fortfahren?"))return;store=incoming;localStorage.setItem(STORAGE_KEY,JSON.stringify(store));const bid=manifest.some(b=>b.id===store.active?.book)?store.active.book:manifest[0].id;$("book").value=bid;currentBook=await loadBook(bid);populateBookUI();restoreActiveControls();updateSelectionUI();resetStudyView();alert("Fortschritt wurde importiert.");}catch(e){alert("Import fehlgeschlagen: "+e.message)}}

$("book").addEventListener("change",async e=>{currentBook=await loadBook(e.target.value);populateBookUI();const first=currentBook.units[0];$("unit").value=first.id;$("pageFrom").value=first.pages[0];$("pageTo").value=first.pages[1];persistControls();resetStudyView();});
$("selectionMode").addEventListener("change",()=>{updateSelectionUI();persistControls();resetStudyView()});
$("unit").addEventListener("change",()=>{const u=unitMeta($("unit").value);$("pageFrom").value=u.pages[0];$("pageTo").value=u.pages[1];persistControls();resetStudyView()});
for(const id of ["pageFrom","pageTo","direction","scope","newLimit"])$(id).addEventListener("change",()=>{persistControls();resetStudyView()});
$("startBtn").onclick=startTraining;$("checkBtn").onclick=check;$("showBtn").onclick=()=>grade(false,true);$("nextBtn").onclick=next;
$("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();answered?next():check();}});
$("exportBtn").onclick=exportProgress;$("importBtn").onclick=()=>$("importFile").click();$("importFile").addEventListener("change",e=>{if(e.target.files[0])importProgress(e.target.files[0]);e.target.value=""});
$("resetBtn").onclick=()=>{const cards=selectedCards();if(!cards.length)return;if(confirm(`Fortschritt für ${selectionLabel()} wirklich zurücksetzen?`)){for(const c of cards){if(store.progress?.[currentBook.id]?.[c.unit])delete store.progress[currentBook.id][c.unit][c.id];}saveStore();resetStudyView();}};

if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));
if(window.visualViewport){let baseY=0;$("answer").addEventListener("focus",()=>{baseY=window.scrollY});window.visualViewport.addEventListener("resize",()=>{if(document.activeElement===$("answer"))requestAnimationFrame(()=>window.scrollTo({top:baseY,left:0,behavior:"instant"}))});}
init();
</script>
</body>
</html>
