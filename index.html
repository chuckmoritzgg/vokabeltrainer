<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#17202a;--muted:#68727d;--accent:#3867d6;--ok:#16834b;--bad:#c0392b;--border:#dce1e7}
*{box-sizing:border-box}
html{min-height:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-text-size-adjust:100%}
.app{max-width:850px;margin:auto;padding:18px;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right));padding-bottom:max(18px,env(safe-area-inset-bottom))}
.top{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{font-size:1.45rem;margin:.2rem 0}.stats{color:var(--muted);font-size:.9rem}.panel,.card,.menu{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 5px 20px #0000000b}
.menu{margin:14px 0;overflow:hidden}.menu summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px;user-select:none}.menu summary::-webkit-details-marker{display:none}.menu summary::after{content:"▾";font-size:.9rem;color:var(--muted);transition:transform .18s ease}.menu[open] summary::after{transform:rotate(180deg)}.menu-content{border-top:1px solid var(--border);padding:14px}.menu-section-title{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin:2px 0 8px}.panel{padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border:0;box-shadow:none;border-radius:0}.menu .data-actions{margin-top:14px;padding-top:14px;border-top:1px solid var(--border)}
select,button,input{font:inherit}select,button{border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:white}button{cursor:pointer}button.primary{background:var(--accent);color:white;border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}
.card{padding:34px 28px;margin-top:14px;text-align:center;min-height:390px;display:flex;flex-direction:column;justify-content:center;overflow-anchor:none}
.prompt-label{color:var(--muted);font-size:.9rem}.prompt{font-size:2.15rem;font-weight:700;margin:18px 0 24px;overflow-wrap:anywhere}
.answer{width:min(620px,100%);margin:0 auto;padding:14px;border:2px solid var(--border);border-radius:12px;outline:none;text-align:center;font-size:1.25rem;scroll-margin-top:140px}
.answer:focus{border-color:var(--accent)}.feedback{margin:18px auto 0;max-width:650px;text-align:left;padding:16px;border-radius:12px}
.feedback.ok{background:#eaf8f0;border:1px solid #bfe7ce}.feedback.bad{background:#fff0ee;border:1px solid #f0c0ba}.correct{font-size:1.25rem;font-weight:700;color:var(--ok);word-break:break-word}.wrong{font-size:1.25rem;font-weight:700;color:var(--bad);word-break:break-word}
.context{margin-top:10px;color:#4c5661;font-style:italic}.actions{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}.progress{height:8px;background:#e7ebef;border-radius:99px;overflow:hidden;margin-top:12px}.bar{height:100%;background:var(--accent);width:0}
.hidden{display:none}.small{font-size:.85rem;color:var(--muted)}.kbd{border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 5px;background:#fafafa}.unit-badge{display:inline-block;margin-left:8px;padding:4px 8px;border-radius:999px;background:#eef2ff;color:#3346a3;font-size:.78rem;font-weight:600;vertical-align:middle}
.data-actions{display:flex;gap:8px;flex-wrap:wrap}.file-input{display:none}.hint{margin:4px 0 0;color:var(--muted);font-size:.8rem}
@media(max-width:600px){
  .app{padding-top:12px} .card{padding:24px 16px;min-height:430px;justify-content:flex-start} .prompt-label{margin-top:34px} .prompt{font-size:1.8rem;margin-top:16px}
  .answer{font-size:1.1rem} .panel label{flex:1 1 145px} .panel select{width:100%;margin-top:4px} .panel .primary{flex:1 1 100%}
}
@media(max-height:560px) and (pointer:coarse){.card{min-height:430px}}
</style>

<body>
<div class="app">
  <div class="top">
    <div><h1>Vokabeltrainer <span class="unit-badge" id="unitBadge">Unit 1</span></h1><div class="stats" id="stats"></div><div class="hint" id="bookHint"></div></div>

  <details class="menu" id="adminMenu" open>
    <summary>Training &amp; Verwaltung</summary>
    <div class="menu-content">
      <div class="menu-section-title">Training auswählen</div>

        <label>Buch:
          <select id="book"></select>
        </label>
        <label>Unit:
          <select id="unit"></select>
        </label>
        <label>Richtung:

            <option value="en-de">Englisch → Deutsch</option>

            <option value="new">Noch nicht gelernt</option>

        <button class="primary" id="startBtn">Training starten</button>

        <input id="importFile" class="file-input" type="file" accept="application/json,.json">
        <button id="resetBtn">Fortschritt zurücksetzen</button>
      </div>
    </div>
  </details>

  <div class="progress"><div class="bar" id="bar"></div></div>

    <div class="small" style="margin-top:18px"><span class="kbd">Enter</span> prüfen / nächste Karte</div>
  </section>
</div>

  store.progress[bookKey] ??={};
  store.progress[bookKey][unitKey] ??={};
  state=store.progress[bookKey][unitKey];
  CARDS=BOOKS[bookKey].units[unitKey].cards;
  store.active={book:bookKey,unit:unitKey};
}
function save(){store.progress[bookKey][unitKey]=state;store.active={book:bookKey,unit:unitKey};localStorage.setItem(STORAGE_KEY,JSON.stringify(store));updateStats();}
function rec(id){if(!state[id]) state[id]={correct:0,wrong:0,seen:0,due:0,streak:0,last:0};return state[id];}
function norm(s){return String(s??"").trim().toLocaleLowerCase("en-GB").replace(/[’‘]/g,"'").replace(/\s+/g," ");}
function answerVariants(s){
  const base=norm(s), withoutParens=norm(s.replace(/[()]/g,"")), withoutOptional=norm(s.replace(/\s*\([^)]*\)/g,""));
  return [...new Set([base,withoutParens,withoutOptional])];
}
function isCorrect(given,expected){return answerVariants(expected).includes(norm(given));}
function populateSelectors(){
  const b=document.getElementById("book");b.innerHTML="";
  for(const [id,book] of Object.entries(BOOKS)){const o=document.createElement("option");o.value=id;o.textContent=book.title+(book.subtitle?" – "+book.subtitle:"");b.append(o)}
  b.value=bookKey; populateUnits();
}
function populateUnits(){
  const u=document.getElementById("unit");u.innerHTML="";
  for(const [id,unit] of Object.entries(BOOKS[bookKey].units)){const o=document.createElement("option");o.value=id;o.textContent=unit.title;u.append(o)}
  if(!validUnit(bookKey,unitKey)) unitKey=Object.keys(BOOKS[bookKey].units)[0]; u.value=unitKey;
}
function updateStats(){
  const vals=Object.values(state),seen=vals.filter(x=>x.seen>0).length,due=CARDS.filter(c=>(state[c.id]?.due||0)<=Date.now()).length,weak=CARDS.filter(c=>state[c.id]?.seen&&state[c.id].wrong>state[c.id].correct).length;
  const unit=BOOKS[bookKey].units[unitKey],book=BOOKS[bookKey];
  document.getElementById("stats").textContent=`${CARDS.length} Vokabeln · ${seen} gelernt · ${due} fällig · ${weak} schwierig`;
  document.getElementById("unitBadge").textContent=unit.title;document.getElementById("bookHint").textContent=book.title+(book.subtitle?" · "+book.subtitle:"");
  document.getElementById("resetBtn").textContent="Fortschritt von "+unit.title+" zurücksetzen";
}
function chooseQueue(){
  const scope=document.getElementById("scope").value,limit=+document.getElementById("newLimit").value;
  let arr=CARDS.filter(c=>{const s=rec(c.id);if(scope==="all")return true;if(scope==="new")return !s.seen;if(scope==="weak")return s.seen&&s.wrong>s.correct;return (s.due||0)<=Date.now();});
  if(scope==="due"){const fresh=arr.filter(c=>!rec(c.id).seen).slice(0,limit),old=arr.filter(c=>rec(c.id).seen);arr=[...fresh,...old]}
  arr.sort(()=>Math.random()-.5);return arr;
}
function setTrainingMenuState(active){const menu=document.getElementById("adminMenu");if(active)menu.open=false;else menu.open=true;}
function start(){queue=chooseQueue();pos=0;answered=false;if(!queue.length){current=null;showDone();return}setTrainingMenuState(true);next();}
function next(){
  if(pos>=queue.length){showDone();return}current=queue[pos++];answered=false;const dir=document.getElementById("direction").value,prompt=dir==="de-en"?current.de:current.en;
  document.getElementById("promptLabel").textContent=dir==="de-en"?"Deutsch":"Englisch";document.getElementById("prompt").textContent=prompt;
  const a=document.getElementById("answer");a.value="";a.disabled=false;a.placeholder=dir==="de-en"?"Englische Vokabel eingeben …":"Deutsche Übersetzung eingeben …";
  document.getElementById("feedback").className="hidden";document.getElementById("checkBtn").disabled=false;document.getElementById("showBtn").disabled=false;document.getElementById("nextBtn").classList.add("hidden");document.getElementById("bar").style.width=(100*(pos-1)/Math.max(queue.length,1))+"%";
  requestAnimationFrame(()=>a.focus({preventScroll:true}));
}
function showDone(){current=null;setTrainingMenuState(false);document.getElementById("promptLabel").textContent="Fertig";document.getElementById("prompt").textContent="Training abgeschlossen";const a=document.getElementById("answer");a.disabled=true;a.value="";const f=document.getElementById("feedback");f.className="feedback ok";f.innerHTML="<strong>Gut gemacht.</strong> Starte erneut, um fällige oder schwierige Vokabeln zu wiederholen.";document.getElementById("checkBtn").disabled=true;document.getElementById("showBtn").disabled=true;document.getElementById("nextBtn").classList.add("hidden");document.getElementById("bar").style.width="100%";}
function schedule(s,good){const now=Date.now(),intervals=[0,1,3,7,14,30,60];if(!good){s.streak=0;s.due=now+2*60*1000;return}s.streak=Math.min((s.streak||0)+1,6);s.due=now+(intervals[s.streak]||60)*86400000;}
function check(){
  if(!current||answered)return;const dir=document.getElementById("direction").value,expected=dir==="de-en"?current.en:current.de,given=document.getElementById("answer").value,ok=isCorrect(given,expected),s=rec(current.id);s.seen=(s.seen||0)+1;s.last=Date.now();if(ok)s.correct=(s.correct||0)+1;else s.wrong=(s.wrong||0)+1;schedule(s,ok);save();answered=true;
  const f=document.getElementById("feedback");f.className="feedback "+(ok?"ok":"bad");const context=current.context?`<div class="context">${escapeHtml(current.context)}</div>`:"";
  f.innerHTML=ok?`<div class="correct">✓ ${escapeHtml(expected)}</div><div>Richtig geschrieben.</div>${context}`:`<div class="wrong">✗ Deine Eingabe: ${escapeHtml(given||"(leer)")}</div><div><strong>Korrekt:</strong> <span class="correct">${escapeHtml(expected)}</span></div><div>Die Schreibweise muss genau stimmen; Text in Klammern ist optional. Groß-/Kleinschreibung wird nicht gewertet.</div>${context}`;
  document.getElementById("answer").disabled=true;document.getElementById("checkBtn").disabled=true;document.getElementById("showBtn").disabled=true;document.getElementById("nextBtn").classList.remove("hidden");
}
function reveal(){if(!current||answered)return;const dir=document.getElementById("direction").value,expected=dir==="de-en"?current.en:current.de;document.getElementById("answer").value=expected;check();}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
function resetStudyView(){queue=[];pos=0;current=null;answered=false;setTrainingMenuState(false);document.getElementById("promptLabel").textContent="Bereit?";document.getElementById("prompt").textContent="Training starten";const a=document.getElementById("answer");a.value="";a.disabled=true;document.getElementById("feedback").className="hidden";document.getElementById("checkBtn").disabled=true;document.getElementById("showBtn").disabled=true;document.getElementById("nextBtn").classList.add("hidden");document.getElementById("bar").style.width="0";}
function switchSelection(){ensureState();save();resetStudyView();updateStats();}
function exportProgress(){
  save();const payload={app:"Vokabeltrainer",schemaVersion:SCHEMA_VERSION,exportedAt:new Date().toISOString(),active:store.active,progress:store.progress};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`vokabeltrainer-fortschritt-${new Date().toISOString().slice(0,10)}.json`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function validateImport(data){return data&&typeof data==="object"&&data.progress&&typeof data.progress==="object";}
async function importProgress(file){
  const data=safeParse(await file.text());if(!validateImport(data)){alert("Diese Datei enthält keinen erkennbaren Vokabeltrainer-Fortschritt.");return}
  if(!confirm("Importierten Lernfortschritt auf diesem Gerät übernehmen? Der bisherige Fortschritt wird ersetzt."))return;
  store=emptyStore();store.progress=data.progress;store.active=data.active||store.active;localStorage.setItem(STORAGE_KEY,JSON.stringify(store));
  bookKey=validBook(store.active?.book)?store.active.book:Object.keys(BOOKS)[0];unitKey=validUnit(bookKey,store.active?.unit)?store.active.unit:Object.keys(BOOKS[bookKey].units)[0];ensureState();populateSelectors();resetStudyView();updateStats();alert("Fortschritt wurde importiert.");
}

document.getElementById("book").addEventListener("change",e=>{bookKey=e.target.value;unitKey=Object.keys(BOOKS[bookKey].units)[0];populateUnits();switchSelection();});
document.getElementById("unit").addEventListener("change",e=>{unitKey=e.target.value;switchSelection();});
document.getElementById("startBtn").onclick=start;document.getElementById("checkBtn").onclick=check;document.getElementById("showBtn").onclick=reveal;document.getElementById("nextBtn").onclick=next;
document.getElementById("resetBtn").onclick=()=>{if(confirm("Den gesamten Lernfortschritt von "+BOOKS[bookKey].units[unitKey].title+" auf diesem Gerät löschen?")){state={};store.progress[bookKey][unitKey]=state;save();resetStudyView();}};
document.getElementById("exportBtn").onclick=exportProgress;document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();document.getElementById("importFile").addEventListener("change",e=>{const f=e.target.files?.[0];if(f)importProgress(f);e.target.value="";});
document.getElementById("answer").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();answered?next():check();}});

// Keep the document scroll position stable while mobile keyboards resize the visual viewport.
let lastStableScrollY=window.scrollY, keyboardLikelyOpen=false;
document.getElementById("answer").addEventListener("focus",()=>{lastStableScrollY=window.scrollY;keyboardLikelyOpen=true;});
document.getElementById("answer").addEventListener("blur",()=>{keyboardLikelyOpen=false;requestAnimationFrame(()=>window.scrollTo({top:lastStableScrollY,behavior:"instant"}));});
if(window.visualViewport){let baseHeight=window.visualViewport.height;window.visualViewport.addEventListener("resize",()=>{const delta=baseHeight-window.visualViewport.height;if(delta>120)keyboardLikelyOpen=true;else if(window.visualViewport.height>=baseHeight-40)keyboardLikelyOpen=false;if(keyboardLikelyOpen)requestAnimationFrame(()=>window.scrollTo(0,lastStableScrollY));});window.addEventListener("orientationchange",()=>setTimeout(()=>{baseHeight=window.visualViewport.height},350));}

ensureState();populateSelectors();updateStats();document.getElementById("answer").disabled=true;
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
